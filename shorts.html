<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shorts · Kermit Web</title><link rel="stylesheet" href="shorts.css"><script src="shorts.js" defer></script><link rel="stylesheet" href="site-ui.css?v=2"><script src="site-theme.js" defer></script></head>
<body><main><aside><span class="eyebrow">KERMIT / SHORTS</span><h1>A little scroll.<br>A lot to watch.</h1><p>Your own feed of YouTube Shorts. Add video links, then scroll or use the arrows.</p><form id="add-form"><label for="links">Add video links</label><textarea id="links" rows="3" required placeholder="Paste full YouTube Shorts URLs, one per line"></textarea><button>Add to feed +</button></form><p id="status" role="status">Your collection is saved in this browser.</p><div class="filters" aria-label="Filter videos"><button data-filter="youtube" aria-pressed="true">YouTube</button></div><p class="note">Not a personalized platform feed. Some videos disable embedding or require sign-in. Use the player to enable sound.</p></aside><section class="viewer" aria-label="Short video collection"><div id="feed" tabindex="0" aria-label="Scrollable video feed"></div><div class="arrows"><button id="previous" aria-label="Previous video">↑</button><span id="count">0 / 0</span><button id="next" aria-label="Next video">↓</button></div></section></main></body></html>
