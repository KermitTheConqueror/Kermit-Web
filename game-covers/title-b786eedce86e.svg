      <stop offset="0" stop-color="#7c2d12"/><stop offset=".58" stop-color="#b45309"/><stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#fde047" stop-opacity=".85"/><stop offset="1" stop-color="#fde047" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".65"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="512" height="512" rx="32" fill="url(#bg)"/>
  <circle cx="204" cy="78" r="85" fill="url(#glow)"/>
