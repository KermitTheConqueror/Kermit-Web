  <rect x="24" y="24" width="184" height="34" rx="17" fill="#05070c" fill-opacity=".64" stroke="#fff" stroke-opacity=".18"/>
  <text x="40" y="47" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">GAME BOY ADVANCE</text>
  <rect x="24" y="292" width="464" height="190" rx="24" fill="#05070c" fill-opacity=".76" stroke="#fff" stroke-opacity=".14"/>
  <text x="38" y="306.5" fill="#fff" font-family="Arial Black,Arial,sans-serif" font-size="39" font-weight="900" filter="url(#shadow)"><tspan x="38" dy="0">Pokémon Emerald</tspan><tspan x="38" dy="47">Randomized</tspan></text>
  <text x="40" y="463" fill="#fde047" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">KERMIT WEB</text>
