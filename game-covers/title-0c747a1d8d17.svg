      <stop offset="0" stop-color="#9f1239"/><stop offset=".58" stop-color="#7e22ce"/><stop offset="1" stop-color="#080b13"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#fb7185" stop-opacity=".85"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".65"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".055"/></pattern>
